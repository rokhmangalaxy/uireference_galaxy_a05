name: Build APK (Gun Nac Offline)

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "android/**"
      - "src/**"
      - "tools/**"
      - "test/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web player (bundles jsnes + mirrors assets for the WebView)
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/emulator.js
          test -f android/app/src/main/assets/web/index.html
          node test/smoke.mjs
          node test/smoke.mjs mmc3
          node test/layout.test.mjs
          node test/bundle.test.mjs
          node test/e2e-import.test.mjs
          node tools/probe-layout.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Runners ship with the Android SDK. Just make sure the pieces we need
      # exist (platform 35 + build-tools) and point Gradle at it.
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > android/local.properties
          ls "$SDK/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        id: assemble
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle.log

      # Job logs live on blob storage that some sandboxes cannot reach, so
      # surface the interesting build errors as check annotations too.
      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          echo "== gradle errors =="
          grep -nE "(^e: |^w: .*(error)|FAILURE:|What went wrong|Caused by:|error:|Unresolved reference|AAPT|Execution failed)" /tmp/gradle.log \
            | head -40 | sed 's/^/::error::/' || true
          echo "== gradle tail =="
          tail -30 /tmp/gradle.log | sed 's/^/::error::/' || true

      - name: Show APK info
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d" " -f1)
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)" \
            | tr "\n" " ; ")
          echo "::notice title=APK::$SIZE bytes | sha256 $SHA | $BADGING"
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "== assets bundled in the APK =="
          unzip -l "$APK" | grep "assets/web/" | awk '{print $4" ("$1" B)"}' | head -12
          WEB_ASSETS=$(unzip -l "$APK" | grep -c "assets/web/")
          echo "::notice title=Contents::$WEB_ASSETS assets/web entries (index.html, emulator.js, app.js, roms/test.nes expected)"
          echo "== signature =="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -4
          echo "::notice title=Signature::$(("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256") || echo unknown)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gun-nac-offline-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Release assets are downloadable straight from github.com without a
      # logged-in Actions page, which makes the APK easy to grab on a phone.
      - name: Publish APK to a GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" /tmp/gun-nac-offline-${{ github.run_number }}.apk
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            "/tmp/gun-nac-offline-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Gun Nac Offline APK #${{ github.run_number }}" \
            --notes "Debug APK built from \`${{ github.sha }}\`.

          * Paket: \`com.rokhmangalaxy.pocketnes\` — minSdk 24, targetSdk 35, no INTERNET permission
          * sha256: \`${{ env.APK_SHA }}\`
          * Install: unduh, izinkan *install from unknown sources*, lalu buka.
          * Player TIDAK menyertakan game. Impor ROM \`.nes\` milik Anda sendiri."
          echo "::notice title=Release::https://github.com/${{ github.repository }}/releases/tag/$TAG"
